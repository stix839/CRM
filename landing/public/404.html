<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found | M2 Media Management</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,900&family=Instrument+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0a0a0a; --paper: #ffffff; --fog: #a1a1aa; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 17px/1.55 "Instrument Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-align: center; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
    .logo { width: 56px; height: 56px; margin: 0 auto 28px; border-radius: 14px; background: var(--paper); color: var(--ink); display: grid; place-items: center; font: 900 22px/1 "Archivo", "Arial Black", Arial, sans-serif; text-decoration: none; }
    h1 { margin: 0 0 12px; font: 900 clamp(40px, 8vw, 72px)/1 "Archivo", "Arial Black", Arial, sans-serif; font-stretch: 112%; letter-spacing: -.02em; }
    p { margin: 0 0 30px; color: #d4d4d8; }
    .btn { display: inline-flex; align-items: center; height: 52px; padding: 0 24px; border-radius: 999px; background: var(--paper); color: var(--ink); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/" aria-label="M2 Media Management home">M2</a>
    <h1>Page not found.</h1>
    <p>That page doesn't exist, but your next customer is still out there.</p>
    <a class="btn" href="/">Go to the homepage</a>
  </main>
</body>
</html>
